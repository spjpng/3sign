<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Simple Sign">
  <title>Simple Sign</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --surface2: #202020;
      --border: #2c2c2c;
      --accent: #c8a96e;
      --accent-dim: rgba(200, 169, 110, 0.13);
      --text: #f0ece4;
      --text-muted: #77706b;
      --text-sub: #aaa39c;
      --danger: #e05c5c;
      --radius: 14px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { min-height: 100dvh; background: var(--bg); color: var(--text); font-family: "DM Sans", sans-serif; overflow-x: hidden; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; color: inherit; }
    .app-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 12px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .logo, .brand-preview { font-family: "DM Serif Display", serif; font-size: 22px; letter-spacing: -0.2px; color: var(--text); }
    .bp-accent { color: var(--accent); }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); display: grid; place-items: center; }
    .icon-btn:active, .btn-back:active, .btn-next:active, .btn-primary:active, .btn-share:active, .btn-ghost:active, .cat-card:active { transform: scale(0.98); opacity: 0.86; }
    .progress-bar { height: 2px; background: var(--border); }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }
    .main { padding: 0 20px 132px; }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeUp 0.22s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .step-label { margin-top: 28px; margin-bottom: 6px; font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
    .step-title { margin-bottom: 24px; font-family: "DM Serif Display", serif; font-size: 30px; line-height: 1.15; }
    .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; min-height: 116px; display: flex; flex-direction: column; gap: 10px; color: var(--text); }
    .cat-card.selected { border-color: var(--accent); background: var(--accent-dim); }
    .cat-card svg { width: 26px; height: 26px; stroke: var(--text-sub); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .cat-card.selected svg { stroke: var(--accent); }
    .cat-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .cat-desc { font-size: 11px; line-height: 1.4; color: var(--text-muted); }
    .field-group { margin-bottom: 20px; }
    .field-label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-muted); }
    .field-input, .field-textarea, .field-select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; color: var(--text); outline: none; appearance: none; }
    .field-textarea { min-height: 92px; line-height: 1.5; resize: vertical; }
    .field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--accent); }
    .line-items { display: flex; flex-direction: column; gap: 8px; }
    .line-item { display: grid; grid-template-columns: 1fr 92px 36px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .line-item input { min-width: 0; border: 0; background: transparent; color: var(--text); padding: 13px 12px; outline: none; }
    .line-item-price { border-left: 1px solid var(--border); text-align: right; }
    .line-item-remove { border-left: 1px solid var(--border); display: grid; place-items: center; color: var(--text-muted); font-size: 20px; }
    .add-line-btn { width: 100%; margin-top: 8px; padding: 12px; border: 1px dashed var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); }
    .total-row { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; margin-top: 12px; border-top: 1px solid var(--border); }
    .total-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
    .total-amount { font-family: "DM Serif Display", serif; font-size: 26px; color: var(--accent); }
    .sig-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .sig-label-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .sig-label-bar span { font-size: 11px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-muted); }
    .sig-clear { color: var(--text-muted); background: none; border: 0; padding: 4px 8px; }
    canvas.sig-canvas { display: block; width: 100%; height: 150px; background: #fff; touch-action: none; }
    .btn-primary, .btn-next { width: 100%; border: 0; border-radius: var(--radius-sm); padding: 16px; background: var(--accent); color: #0a0a0a; font-weight: 600; }
    .btn-share, .btn-ghost, .use-saved-btn { width: 100%; border-radius: var(--radius-sm); padding: 14px; background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-share, .use-saved-btn { border-color: var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-ghost { margin-top: 10px; color: var(--text-sub); }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; gap: 10px; padding: 12px 20px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--border); }
    .btn-back { width: 48px; min-width: 48px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-sub); font-size: 20px; }
    .done-screen { text-align: center; padding-top: 48px; }
    .done-icon { width: 76px; height: 76px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent); }
    .done-title { font-family: "DM Serif Display", serif; font-size: 34px; margin-bottom: 10px; }
    .done-sub { margin-bottom: 34px; color: var(--text-muted); line-height: 1.6; }
    body.modal-open { overflow: hidden; position: fixed; width: 100%; }
    .overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(6px); }
    .overlay.open { display: flex; }
    .sheet { width: 100%; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 20px max(28px, env(safe-area-inset-bottom)); }
    .sheet-handle { width: 36px; height: 4px; margin: 0 auto 20px; border-radius: 3px; background: var(--border); }
    .sheet-title { font-family: "DM Serif Display", serif; font-size: 24px; margin-bottom: 22px; }
    .settings-section { margin-bottom: 22px; }
    .settings-section-label { margin-bottom: 10px; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
    .color-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .color-swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; }
    .color-swatch.active { border-color: #fff; transform: scale(1.08); }
    .client-wrap { position: fixed; inset: 0; z-index: 200; display: none; background: var(--bg); overflow-y: auto; }
    .client-wrap.active { display: block; }
    .detail-card, .action-banner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
    .action-banner { padding: 16px; background: var(--accent-dim); border-color: var(--accent); }
    .action-banner-label { margin-bottom: 5px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); font-weight: 600; }
    .action-banner-text { color: var(--text); line-height: 1.5; font-size: 14px; }
    .detail-row { display: flex; justify-content: space-between; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .detail-row:last-child { border-bottom: 0; }
    .detail-row-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; }
    .detail-row-val { color: var(--text); font-size: 13px; text-align: right; }
    .toast { position: fixed; left: 50%; bottom: 100px; z-index: 500; transform: translateX(-50%) translateY(14px); opacity: 0; pointer-events: none; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 10px 18px; font-size: 13px; white-space: nowrap; transition: 0.22s ease; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header class="app-header" id="appHeader">
    <div class="logo" id="headerLogo">simple<span class="bp-accent">sign</span></div>
    <button class="icon-btn" type="button" onclick="openSettings()" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div class="progress-bar" id="appProgress"><div class="progress-fill" id="progressFill"></div></div>

  <main class="main" id="appMain">
    <section class="screen active" id="screen-1">
      <p class="step-label">Step 1 of 5</p>
      <h1 class="step-title">What are we signing today?</h1>
      <div class="category-grid" id="categoryGrid"></div>
    </section>

    <section class="screen" id="screen-2">
      <p class="step-label">Step 2 of 5</p>
      <h1 class="step-title">Who's involved?</h1>
      <div class="field-group"><label class="field-label" for="yourName">Your Name / Business</label><input class="field-input" id="yourName" type="text" placeholder="Your name or business name" autocomplete="off"></div>
      <div class="field-group"><label class="field-label" for="clientName">Client Full Name</label><input class="field-input" id="clientName" type="text" placeholder="Client full name" autocomplete="off"></div>
      <div class="field-group"><label class="field-label" for="docDate">Date</label><input class="field-input" id="docDate" type="date"></div>
    </section>

    <section class="screen" id="screen-3">
      <p class="step-label">Step 3 of 5</p>
      <h1 class="step-title" id="detailsTitle">Agreement Details</h1>
      <div id="detailsFields"></div>
    </section>

    <section class="screen" id="screen-4">
      <p class="step-label">Step 4 of 5</p>
      <h1 class="step-title">Signatures</h1>
      <div class="field-group">
        <label class="field-label">Your Signature</label>
        <button class="use-saved-btn" id="useSavedRow" type="button" onclick="applySavedSig()" style="display:none;margin-bottom:12px;">Use my saved signature</button>
        <div id="savedSigDisplay" style="display:none;margin-bottom:14px;">
          <div class="sig-container"><img id="savedSigImg" alt="Saved signature" style="display:block;width:100%;height:100px;object-fit:contain;background:#fff;padding:8px;"><button class="btn-ghost" type="button" onclick="clearSavedSigUsed()">Sign differently</button></div>
        </div>
        <div id="yourDrawBlock" class="sig-container">
          <div class="sig-label-bar"><span>Your Signature</span><button class="sig-clear" type="button" onclick="clearCanvas('yourSigCanvas')">Clear</button></div>
          <canvas class="sig-canvas" id="yourSigCanvas"></canvas>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Client Signature</label>
        <div class="sig-container">
          <div class="sig-label-bar"><span id="clientSigLabel">Client Signature</span><button class="sig-clear" type="button" onclick="clearCanvas('clientSigCanvas')">Clear</button></div>
          <canvas class="sig-canvas" id="clientSigCanvas"></canvas>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-5">
      <div class="done-screen">
        <div class="done-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <h1 class="done-title">Ready.</h1>
        <p class="done-sub" id="doneSubText">Your agreement is ready.</p>
        <button class="btn-primary" type="button" onclick="generatePDF()" style="margin-bottom:10px;">Download My Copy</button>
        <button class="btn-share" type="button" onclick="shareWithClient()">Send to Client for Signature</button>
        <button class="btn-ghost" type="button" onclick="startOver()">Start New Agreement</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="btn-back" id="backBtn" type="button" onclick="goBack()">&#8592;</button>
    <button class="btn-next" id="nextBtn" type="button" onclick="goNext()">Continue &#8594;</button>
  </nav>

  <div class="client-wrap" id="clientWrap"></div>

  <div class="overlay" id="settingsOverlay" onclick="overlayClickClose(event, 'settingsOverlay')">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title">Settings</h2>
      <div class="settings-section">
        <div class="settings-section-label">Brand Name</div>
        <input class="field-input" id="sBizName" type="text" placeholder="e.g. Jet Creative" oninput="saveSetting('bizName', this.value); updateBrandPreview();">
      </div>
      <div class="settings-section">
        <div class="settings-section-label">Tagline</div>
        <input class="field-input" id="sTagline" type="text" placeholder="e.g. Professional Services" oninput="saveSetting('tagline', this.value); updateBrandPreview();">
      </div>
      <div class="settings-section">
        <div class="settings-section-label">Your Email</div>
        <input class="field-input" id="sEmail" type="email" placeholder="you@email.com" oninput="saveSetting('email', this.value)">
      </div>
      <div class="settings-section">
        <div class="settings-section-label">Default Signature</div>
        <div class="sig-container" style="margin-bottom:10px;"><canvas class="sig-canvas" id="settingsSigCanvas"></canvas></div>
        <button class="use-saved-btn" type="button" onclick="saveDefaultSignature()">Save Signature</button>
      </div>
      <div class="settings-section">
        <div class="settings-section-label">Background</div>
        <div class="color-row" id="bgColorRow"></div>
      </div>
      <div class="settings-section">
        <div class="settings-section-label">Accent</div>
        <div class="color-row" id="accentColorRow"></div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;">
        <div class="brand-preview" id="brandPreview"></div>
        <div id="taglinePreview" style="font-size:11px;color:var(--text-muted);letter-spacing:1px;margin-top:2px;"></div>
      </div>
      <button class="btn-primary" type="button" onclick="closeSettings()">Save &amp; Close</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let step = 1;
    let category = null;
    let usingDefaultSig = false;
    let lineCount = 0;
    let clientPayload = null;
    let clientSigData = null;
    let clientPdfDoc = null;
    let settingsScrollY = 0;
    const PUBLIC_SHARE_BASE = "https://spjpng.github.io/3sign/";

    const DEFAULT_SETTINGS = {
      bizName: "",
      tagline: "",
      defaultSigData: "",
      bgColor: "#0a0a0a",
      accentColor: "#c8a96e",
      email: ""
    };
    let S = { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem("ss_settings") || "{}") };

    const CATS = {
      basic: { name: "Basic Agreement", desc: "Simple custom terms", icon: '<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/>' },
      car: { name: "Car Rental Agreement", desc: "Vehicle rental agreement", icon: '<path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l2-4h10l2 4h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/>' },
      barber: { name: "Barber Agreement", desc: "Booth rental and terms", icon: '<path d="M6 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/><path d="M18 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/><path d="M6 9l12 12M18 9L6 21"/>' },
      photo: { name: "Photo / Video", desc: "Creative services", icon: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>' },
      nda: { name: "NDA", desc: "Non-disclosure agreement", icon: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' },
      invoice: { name: "Invoice", desc: "Line items and total", icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/>' },
      receipt: { name: "Receipt", desc: "Payment confirmation", icon: '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>' }
    };

    window.addEventListener("load", () => {
      renderCategories();
      renderSwatches();
      applyTheme();
      loadSettingsUI();
      document.getElementById("docDate").value = todayISO();
      if (S.bizName) document.getElementById("yourName").value = S.bizName;
      if (!checkClientMode()) {
        initDrawCanvas("yourSigCanvas");
        initDrawCanvas("clientSigCanvas");
        initDrawCanvas("settingsSigCanvas");
        updateNav();
        updateProgress();
      }
    });

    function persist() { localStorage.setItem("ss_settings", JSON.stringify(S)); }
    function saveSetting(k, v) { S[k] = v; persist(); }
    function todayISO() { return new Date().toISOString().split("T")[0]; }
    function V(id) { const el = document.getElementById(id); return el ? (el.value || "") : ""; }
    function money(v) { return "$" + (parseFloat(v) || 0).toFixed(2); }
    function shareBaseUrl() {
      const isLocal = location.protocol === "file:" || ["127.0.0.1", "localhost"].includes(location.hostname);
      if (isLocal) return PUBLIC_SHARE_BASE;
      return location.href.split("?")[0].split("#")[0];
    }
    function encodePayload(payload) {
      const json = JSON.stringify(payload);
      const bytes = new TextEncoder().encode(json);
      let binary = "";
      bytes.forEach(byte => { binary += String.fromCharCode(byte); });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }
    function decodePayload(data) {
      const normalized = data.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      const bytes = Uint8Array.from(atob(padded), char => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function renderCategories() {
      document.getElementById("categoryGrid").innerHTML = Object.entries(CATS).map(([key, cat]) => `
        <button class="cat-card" id="cat-${key}" type="button" onclick="selectCategory('${key}')">
          <svg viewBox="0 0 24 24">${cat.icon}</svg>
          <span class="cat-name">${cat.name}</span>
          <span class="cat-desc">${cat.desc}</span>
        </button>
      `).join("");
    }

    function hexToRgbArr(hex) {
      const h = hex.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function hexToRgba(hex, a) { const [r, g, b] = hexToRgbArr(hex); return `rgba(${r}, ${g}, ${b}, ${a})`; }
    function shade(hex, amt) {
      const [r, g, b] = hexToRgbArr(hex);
      return `rgb(${Math.max(0, Math.min(255, r + amt))}, ${Math.max(0, Math.min(255, g + amt))}, ${Math.max(0, Math.min(255, b + amt))})`;
    }
    function luminance(hex) { const [r, g, b] = hexToRgbArr(hex); return 0.299 * r + 0.587 * g + 0.114 * b; }

    function applyTheme() {
      const r = document.documentElement;
      r.style.setProperty("--bg", S.bgColor);
      r.style.setProperty("--accent", S.accentColor);
      r.style.setProperty("--accent-dim", hexToRgba(S.accentColor, 0.13));
      if (luminance(S.bgColor) < 80) {
        r.style.setProperty("--surface", shade(S.bgColor, 12));
        r.style.setProperty("--surface2", shade(S.bgColor, 22));
        r.style.setProperty("--border", shade(S.bgColor, 34));
        r.style.setProperty("--text", "#f0ece4");

    function initDrawCanvas(id) {
      const canvas = document.getElementById(id);
      if (!canvas) return;
      resizeCanvas(canvas);
      let drawing = false;
      function pos(e) {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      }
      function start(e) {
        e.preventDefault();
        drawing = true;
        const p = pos(e);
        const ctx = canvas.getContext("2d");
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      }
      function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const p = pos(e);
        const ctx = canvas.getContext("2d");
        ctx.strokeStyle = "#1a1a1a";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      }
      function stop() { drawing = false; }
      canvas.addEventListener("mousedown", start);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", stop);
      canvas.addEventListener("mouseleave", stop);
      canvas.addEventListener("touchstart", start, { passive: false });
      canvas.addEventListener("touchmove", draw, { passive: false });
      canvas.addEventListener("touchend", stop);
    }
    function resizeCanvas(canvas, imageData) {
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, rect.width * dpr);
      canvas.height = Math.max(1, rect.height * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (imageData) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
        img.src = imageData;
      }
    }
    function clearCanvas(id) {
      const c = document.getElementById(id);
      if (!c) return;
      c.getContext("2d").clearRect(0, 0, c.width, c.height);
    }
    function isCanvasBlank(canvas) {
      if (!canvas) return true;
      const data = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
      for (let i = 3; i < data.length; i += 4) if (data[i] > 10) return false;
      return true;
    }
    function canvasToWhitePNG(canvas) {
      const flat = document.createElement("canvas");
      flat.width = canvas.width;
      flat.height = canvas.height;
      const ctx = flat.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, flat.width, flat.height);
      ctx.drawImage(canvas, 0, 0);
      return flat.toDataURL("image/png");
    }

    function clientRows(payload) {
      const fields = payload.fields || {};
      let rows = [
        ["From", fields.yourName || payload.bizName],
        ["Date", fmtDate(fields.docDate)]
      ];
      if (payload.cat === "basic") rows.push(["Title", fields.basicTitle], ["Purpose", fields.basicPurpose], ["Start", fmtDate(fields.basicStartDate)], ["End", fmtDate(fields.basicEndDate)], ["Amount", money(fields.basicAmount)], ["Terms", fields.basicTerms]);
      else if (payload.cat === "car") rows.push(["Vehicle", fields.carMake], ["Pickup", fmtDate(fields.carPickup)], ["Return", fmtDate(fields.carReturn)], ["Daily Rate", money(fields.carRate)], ["Deposit", money(fields.carDeposit)]);
      else if (payload.cat === "barber") rows.push(["Booth", fields.barberStation], ["Weekly Rent", money(fields.barberRate)], ["Start Date", fmtDate(fields.barberStartDate)], ["Schedule", fields.barberSchedule]);
      else if (payload.cat === "photo") rows.push(["Service", fields.photoType], ["Shoot Date", fmtDate(fields.photoDate)], ["Location", fields.photoLocation], ["Deliverables", fields.photoDeliverables], ["Total Rate", money(fields.photoRate)], ["Deposit", money(fields.photoDeposit)]);
      else if (payload.cat === "nda") rows.push(["Purpose", fields.ndaPurpose], ["Duration", fields.ndaDuration], ["Jurisdiction", fields.ndaJurisdiction]);
      else {
        rows.push([payload.cat === "invoice" ? "Invoice #" : "Receipt #", fields.invNumber], ["Date", fmtDate(fields.invDue)], ["Notes", fields.invNotes]);
        let total = 0;
        payload.lines.forEach(li => { total += parseFloat(li.p) || 0; rows.push([li.d || "Item", money(li.p)]); });
        rows.push(["Total", money(total)]);
      }
      return rows.filter(r => r[1]).map(([l, v]) => `<div class="detail-row"><span class="detail-row-label">${l}</span><span class="detail-row-val">${v}</span></div>`).join("");

    function doClientShare() {

    function fmtDate(s) {
      if (!s) return "";
      const parts = s.split("-");
      if (parts.length !== 3) return s;
      const [y, m, d] = parts;
      const names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${names[parseInt(m, 10) - 1]} ${parseInt(d, 10)}, ${y}`;
    }
    function generatePDF() {
      const payload = { cat: category, fields: collectFields(), lines: collectLines(), bizName: S.bizName, accentColor: S.accentColor, bgColor: S.bgColor };
      const yourSig = usingDefaultSig ? S.defaultSigData : (!isCanvasBlank(document.getElementById("yourSigCanvas")) ? canvasToWhitePNG(document.getElementById("yourSigCanvas")) : "");
      const clientSig = !isCanvasBlank(document.getElementById("clientSigCanvas")) ? canvasToWhitePNG(document.getElementById("clientSigCanvas")) : "";
      const doc = buildPDF(payload, clientSig, false, yourSig);
      doc.save(`${category}_${(V("clientName") || "client").replace(/\s+/g, "_")}_${V("docDate")}.pdf`);
      showToast("PDF downloaded");
    }
    function buildPDF(payload, clientSignature, clientOnly, yourSignature = "") {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      const W = 210, H = 297, mg = 20, cW = W - mg * 2;
      const fields = payload.fields || {};
      const catName = CATS[payload.cat]?.name || "Agreement";
      const biz = payload.bizName || fields.yourName || "Simple Sign";
      const [ar, ag, ab] = hexToRgbArr(payload.accentColor || S.accentColor);
      const [br, bg, bb] = hexToRgbArr(payload.bgColor || S.bgColor);
      let y = 42;
      doc.setFillColor(br, bg, bb); doc.rect(0, 0, W, 32, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(17); doc.setTextColor(240, 236, 228); doc.text("simplesign", mg, 14);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(ar, ag, ab); doc.text(biz.toUpperCase(), mg, 21);
      doc.setFontSize(7); doc.setTextColor(150, 145, 140); doc.text(catName.toUpperCase(), W - mg, 13, { align: "right" }); doc.text(fmtDate(fields.docDate), W - mg, 20, { align: "right" });
      doc.setFillColor(ar, ag, ab); doc.rect(0, 32, W, 1.5, "F");
      doc.setFillColor(247, 246, 244); doc.roundedRect(mg, y, cW, 20, 2, 2, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(140, 135, 130); doc.text("PARTY A", mg + 6, y + 7); doc.text("PARTY B", W / 2 + 4, y + 7);
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(28, 26, 24); doc.text(fields.yourName || "-", mg + 6, y + 15); doc.text(fields.clientName || "-", W / 2 + 4, y + 15);
      y += 30;
      y = renderPdfBody(doc, y, mg, cW, W, payload, [ar, ag, ab]);
      y = Math.max(y + 12, H - 72);
      doc.setDrawColor(200, 198, 195); doc.line(mg, y, W - mg, y); y += 7;
      doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(140, 135, 130); doc.text("SIGNATURES", mg, y); y += 7;
      const sW = (cW - 10) / 2;
      if (yourSignature && !clientOnly) doc.addImage(yourSignature, "PNG", mg, y, sW, 16);
      if (clientSignature) doc.addImage(clientSignature, "PNG", mg + sW + 10, y, sW, 16);
      y += 18;
      doc.setDrawColor(28, 26, 24); doc.line(mg, y, mg + sW, y); doc.line(mg + sW + 10, y, W - mg, y); y += 4;
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(140, 135, 130); doc.text(fields.yourName || "Authorized Party", mg, y); doc.text(fields.clientName || "Client", mg + sW + 10, y);
      doc.setFillColor(br, bg, bb); doc.rect(0, H - 10, W, 10, "F");
      doc.setFontSize(7); doc.setTextColor(110, 105, 100); doc.text(`Generated by Simple Sign - ${fmtDate(fields.docDate || todayISO())}`, W / 2, H - 4, { align: "center" });
      return doc;
    }
    function renderPdfBody(doc, y, mg, cW, W, payload, accent) {
      const fields = payload.fields || {};
      function section(title) { doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(140, 135, 130); doc.text(title.toUpperCase(), mg, y); y += 7; }
      function row(label, value) {
        if (!value || y > 245) return;
        doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(140, 135, 130); doc.text(label, mg, y);
        doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(28, 26, 24);
        const lines = doc.splitTextToSize(String(value), cW - 62);
        doc.text(lines, mg + 62, y);
        y += Math.max(lines.length * 5, 7);
      }
      section(CATS[payload.cat]?.name || "Agreement");
      if (payload.cat === "basic") {
        row("Title", fields.basicTitle); row("Purpose", fields.basicPurpose); row("Start Date", fmtDate(fields.basicStartDate)); row("End Date", fmtDate(fields.basicEndDate)); row("Amount", money(fields.basicAmount)); row("Terms", fields.basicTerms);
      } else if (payload.cat === "car") {
        row("Vehicle", fields.carMake); row("Plate", fields.carPlate); row("Pickup", fmtDate(fields.carPickup)); row("Return", fmtDate(fields.carReturn)); row("Daily Rate", money(fields.carRate)); row("Deposit", money(fields.carDeposit)); row("Terms", fields.carTerms);
      } else if (payload.cat === "barber") {
        row("Station", fields.barberStation); row("Weekly Rent", money(fields.barberRate)); row("Start Date", fmtDate(fields.barberStartDate)); row("Schedule", fields.barberSchedule); row("Terms", fields.barberTerms);
      } else if (payload.cat === "photo") {
        row("Service", fields.photoType); row("Shoot Date", fmtDate(fields.photoDate)); row("Location", fields.photoLocation); row("Coverage", fields.photoHours); row("Deliverables", fields.photoDeliverables); row("Total Rate", money(fields.photoRate)); row("Deposit", money(fields.photoDeposit)); row("Terms", fields.photoTerms);
      } else if (payload.cat === "nda") {
        row("Purpose", fields.ndaPurpose); row("Duration", fields.ndaDuration); row("Jurisdiction", fields.ndaJurisdiction); row("Scope", fields.ndaScope);
      } else {
        row(payload.cat === "invoice" ? "Invoice #" : "Receipt #", fields.invNumber); row("Date", fmtDate(fields.invDue)); row("Notes", fields.invNotes);
        let total = 0;
        (payload.lines || []).forEach(li => { total += parseFloat(li.p) || 0; row(li.d || "Item", money(li.p)); });
        doc.setFillColor(...accent); doc.rect(mg, y, cW, 10, "F"); doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(28, 26, 24); doc.text("TOTAL", mg + 4, y + 7); doc.text(money(total), W - mg - 4, y + 7, { align: "right" }); y += 14;
      }
      return y;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }
  </script>
</body>
